# Builds LGPL-only libmpv for Windows x86_64 in two variants, gates the licence,
# smoke-tests each on a Windows runner, and (on request) releases the stable one.
# Needs the cache from windows-toolchain.yml. Derived from shinchiro's mpv_clang.yml.
name: windows libmpv
defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release for the variant named below (only if its smoke test passed)'
        type: boolean
        default: false
      release_variant:
        description: 'Variant to release'
        type: choice
        options: [stable, next]
        default: stable

env:
  CACHE_VERSION: v1
  BUILD_IMAGE: ghcr.io/shinchiro/archlinux@sha256:56a74bc68139d108ee082f1d0a488295eaf5af2f1b79f0cbbb7caca1c4402bbd

jobs:
  build:
    name: Build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    # Only the variant being released gates the release; the other is informational.
    continue-on-error: ${{ matrix.variant != (inputs.release_variant || 'stable') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: stable
            mpv_ref: v0.41.0
            ffmpeg_ref: n8.1.3
          - variant: next
            # mpv master after its FFmpeg 9 migration (2026-11-02)
            mpv_ref: a687796d9d0efded1787d497167facd462b8f2ee
            ffmpeg_ref: n9.0.2
    container:
      image: docker://ghcr.io/shinchiro/archlinux@sha256:56a74bc68139d108ee082f1d0a488295eaf5af2f1b79f0cbbb7caca1c4402bbd
    defaults:
      run:
        working-directory: windows
    steps:
      - name: Setup git config
        working-directory: .
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4

      # Fails fast (before the hour-long build) on options this FFmpeg doesn't know.
      - name: FFmpeg options check
        run: scripts/ffmpeg_options_check.sh ${{ matrix.ffmpeg_ref }}

      - name: mpv options check
        run: scripts/mpv_options_check.sh ${{ matrix.mpv_ref }}

      - name: Loading clang root
        uses: actions/cache/restore@v4
        with:
          path: windows/clang_root
          key: ${{ env.CACHE_VERSION }}-clang_root-${{ github.run_id }}
          restore-keys: ${{ env.CACHE_VERSION }}-clang_root
          fail-on-cache-miss: true

      - name: Loading x86_64 toolchain
        uses: actions/cache/restore@v4
        with:
          path: windows/build_x86_64
          key: ${{ env.CACHE_VERSION }}-clang-x86_64_toolchain-${{ github.run_id }}
          restore-keys: ${{ env.CACHE_VERSION }}-clang-x86_64_toolchain
          fail-on-cache-miss: true

      - name: Configure + download sources
        run: |
          cmake -DTARGET_ARCH=x86_64-w64-mingw32 -DCOMPILER_TOOLCHAIN=clang -DCMAKE_INSTALL_PREFIX=$PWD/clang_root -DMINGW_INSTALL_PREFIX=$PWD/build_x86_64/x86_64-w64-mingw32 -DSINGLE_SOURCE_LOCATION=$PWD/src_packages -DRUSTUP_LOCATION=$PWD/clang_root/install_rustup -DENABLE_CCACHE=ON -DCLANG_PACKAGES_LTO=ON -DMPV_REF=${{ matrix.mpv_ref }} -DFFMPEG_REF=${{ matrix.ffmpeg_ref }} -G Ninja --fresh -B build_x86_64 -S $PWD
          ninja -C build_x86_64 download || true

      - name: Build mpv
        run: |
          ninja -C build_x86_64 update
          ninja -C build_x86_64 mpv

      - name: Licence gate
        run: scripts/licence_gate.sh build_x86_64/packages

      - name: Features gate (decoders/filters beyond media_kit's set)
        run: scripts/features_gate.sh build_x86_64/packages

      - name: Package
        run: |
          mkdir -p release
          ninja -C build_x86_64 mpv-packaging
          mv build_x86_64/mpv-dev-*.7z release/
          cd release && for f in mpv-dev-*.7z; do md5sum "$f" | cut -d' ' -f1 > "$f.md5"; done
          ls -la

      - name: Collect logs
        if: always()
        run: |
          mkdir -p logs
          cp -fr $(find build_x86_64 -type f -iname "*-*.log" -or -wholename "*/ffbuild/config.log") logs || true
          7z a -m0=lzma2 -mx=9 -ms=on logs.7z logs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.variant }}
          path: windows/logs.7z
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: mpv-dev-${{ matrix.variant }}
          path: windows/release/*

  smoke:
    name: Smoke (${{ matrix.variant }})
    needs: build
    runs-on: windows-latest
    # Only the variant being released gates the release; the other is informational.
    continue-on-error: ${{ matrix.variant != (inputs.release_variant || 'stable') }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: stable
            expect_mpv: v0.41.0
            expect_ffmpeg: 8.1.3
          - variant: next
            expect_mpv: mpv
            expect_ffmpeg: 9.0.2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mpv-dev-${{ matrix.variant }}
          path: dist
      - name: Run smoke test
        run: |
          cd dist && 7z x -y mpv-dev-*.7z > /dev/null && cd ..
          python windows/smoke/smoke.py dist/libmpv-2.dll --expect-mpv "${{ matrix.expect_mpv }}" --expect-ffmpeg "${{ matrix.expect_ffmpeg }}" --extended

  smoke-control:
    name: Smoke control (upstream 20241021 must fail the seek check)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Upstream DLL fails the fMP4 seek check
        run: |
          curl -sSfL -o up.7z https://github.com/media-kit/libmpv-win32-video-cmake/releases/download/20241021/mpv-dev-x86_64-20241021-git-0f78584.7z
          # MD5 published in media_kit_libs_windows_video's CMakeLists (c533e44675)
          echo "6ecf18e85b093c3f7edb16f3ee6603f3  up.7z" | md5sum -c -
          mkdir up && cd up && 7z x -y ../up.7z > /dev/null && cd ..
          if python windows/smoke/smoke.py up/libmpv-2.dll; then
            echo "Control unexpectedly passed: the smoke test no longer catches the FFmpeg 7.1 seek bug" >&2
            exit 1
          fi
          echo "Control failed as expected"

  release:
    name: Release
    if: ${{ inputs.release }}
    needs: [smoke, smoke-control]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VARIANT: ${{ inputs.release_variant }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mpv-dev-${{ inputs.release_variant }}
          path: dist
      - name: Publish
        run: |
          f=$(ls dist/mpv-dev-*.7z)
          ver=$( [ "$VARIANT" = stable ] && echo "mpv0.41.0-ff8.1.3" || echo "mpvmaster-ff9.0.2")
          tag="windows-$(date -u +%Y%m%d)-$ver-g${GITHUB_SHA:0:7}"
          gh release create "$tag" dist/* -R "${{ github.repository }}" \
            --title "$tag" \
            --notes "LGPL-only libmpv for Windows x86_64 ($ver). FFmpeg built with --disable-gpl --disable-nonfree --enable-version3; mpv -Dgpl=false. Sources: pinned refs in windows/packages at ${{ github.sha }}. MD5: $(cat dist/*.md5)"
