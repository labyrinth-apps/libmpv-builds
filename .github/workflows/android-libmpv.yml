# Builds LGPL-only libmpv for Android (arm64-v8a, armeabi-v7a, x86_64, x86) from
# android/ (derived from media-kit/libmpv-android-video-build), packages the
# default-<abi>.jar files media_kit_libs_android_video downloads, gates the
# licence, smoke-tests x86_64 on an emulator against an upstream v1.1.7 control
# and (on request) publishes a release.
name: android libmpv
defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release (only if build, gates and smoke test passed)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  MPV_VERSION: 0.41.0
  FFMPEG_VERSION: 8.1.3

jobs:
  meta:
    name: Meta
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=android-$(date -u +%Y%m%d)-mpv${MPV_VERSION}-ff${FFMPEG_VERSION}-g${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, abi: arm64-v8a }
          - { arch: armv7l, abi: armeabi-v7a }
          - { arch: x86_64, abi: x86_64 }
          - { arch: x86, abi: x86 }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Licence gate self-test (fake GPL configs must fail)
        run: android/scripts/test_licence_gate.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf automake libtool pkg-config nasm ninja-build zip
          pip install meson==1.9.1 jinja2 markupsafe
          meson --version; ninja --version; nasm -v; cmake --version | head -1

      - name: Symlink SDK
        working-directory: android/buildscripts
        run: |
          mkdir -p sdk
          ln -s "$ANDROID_HOME" sdk/android-sdk-linux

      - name: Build + package
        working-directory: android/buildscripts
        run: ./bundle_default.sh ${{ matrix.arch }}

      - name: Licence gate
        run: android/scripts/licence_gate.sh android/buildscripts/artifacts/licence

      - name: Features gate (decoders/filters beyond media_kit's set)
        run: android/scripts/features_gate.sh android/buildscripts/artifacts/licence

      - name: Verify jar (layout, SONAME, NEEDED, exports, 16 KB pages)
        run: |
          . android/buildscripts/include/depinfo.sh
          android/scripts/verify_jar.sh android/buildscripts/artifacts/default-${{ matrix.abi }}.jar \
            "$ANDROID_HOME/ndk/$v_ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          grep -E "Message|libplacebo|android|opensles|audiotrack|egl|gpl" android/buildscripts/artifacts/licence/${{ matrix.abi }}/mpv/configure.log | head -60 || true

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}
          path: |
            android/buildscripts/artifacts/default-${{ matrix.abi }}.jar
            android/buildscripts/artifacts/default-${{ matrix.abi }}.jar.md5
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}-debug
          path: |
            android/buildscripts/artifacts/debug/
            android/buildscripts/artifacts/licence/
          if-no-files-found: error

  smoke:
    name: Smoke (x86_64 emulator; upstream v1.1.7 control must fail the seek)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: android-x86_64
          path: dist

      - name: Prepare (our jar, upstream control jar, PNG playlist, smoke binary)
        run: |
          . android/buildscripts/include/depinfo.sh
          w=$RUNNER_TEMP/smoke; mkdir -p "$w/ours" "$w/control" "$w/dl"
          (cd dist && [ "$(md5sum default-x86_64.jar | cut -d' ' -f1)" == "$(cat default-x86_64.jar.md5)" ])
          unzip -j -o dist/default-x86_64.jar lib/x86_64/libmpv.so -d "$w/ours"
          # Control: upstream v1.1.7 (FFmpeg 6.0), verified against media_kit's published MD5 before unzipping
          curl -fsSL --retry 5 -o "$w/dl/default-x86_64.jar" \
            https://github.com/media-kit/libmpv-android-video-build/releases/download/v1.1.7/default-x86_64.jar
          echo "6fa26bf0459b11f1c0b0dbc29e5b940d  $w/dl/default-x86_64.jar" | md5sum -c -
          unzip -j -o "$w/dl/default-x86_64.jar" lib/x86_64/libmpv.so -d "$w/control"
          python3 -I android/smoke/make_png_playlist.py "$w/png"
          [ -d "$ANDROID_HOME/ndk/$v_ndk" ] || { yes 2>/dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$v_ndk" >/dev/null || true; }
          "$ANDROID_HOME/ndk/$v_ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android${v_api}-clang" \
            -O2 -Wall -o "$w/smoke" android/smoke/smoke.c -ldl
          echo "SMOKE_DIR=$w" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash android/smoke/run_on_emulator.sh "$SMOKE_DIR" "$MPV_VERSION" "$FFMPEG_VERSION"

  release:
    name: Release
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    needs: [meta, build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: android-*
          path: dist
          merge-multiple: true
      - name: Publish
        run: |
          cd dist
          rm -rf debug licence
          for a in arm64-v8a armeabi-v7a x86_64 x86; do
            [ "$(md5sum default-$a.jar | cut -d' ' -f1)" == "$(cat default-$a.jar.md5)" ]
          done
          ls -la
          gh release create "$TAG" default-*.jar default-*.jar.md5 -R "${{ github.repository }}" \
            --title "$TAG" \
            --notes "LGPL-only libmpv for Android (arm64-v8a, armeabi-v7a, x86_64, x86; API 21+): mpv v${MPV_VERSION}, FFmpeg ${FFMPEG_VERSION}, default flavour, same jar layout as media-kit/libmpv-android-video-build v1.1.7 (lib/<abi>/libmpv.so + libmediakitandroidhelper.so). FFmpeg configured with --disable-gpl --disable-nonfree --enable-version3; mpv -Dgpl=false; licence gate passed. Sources and patches: android/ at ${{ github.sha }} (pinned in android/buildscripts/include/depinfo.sh). MD5s in default-<abi>.jar.md5 (for media_kit_libs_android_video's build.gradle)."
